name: SEO Weekly

# Runs every Sunday at 04:00 UTC (07:00 Israel time).  ~5-7 minutes of CI per
# week - negligible against the GitHub Actions free-tier quota.
#
# Each run:
#   1. Regenerates the dynamic sitemap from Supabase (every active listing,
#      every (deal × city × rooms) landing, every blog post)
#   2. Generates a fresh weekly market report (markdown blog post + index)
#   3. Regenerates the RSS feed combining blog posts + 50 newest listings
#   4. Submits the changed URLs to Bing/Yandex/Seznam via IndexNow
#   5. Commits the regenerated public/* files back to master so Vercel
#      auto-deploys the new sitemap + blog post
#   6. Sends a one-line Telegram summary to Doron
#
# Manual trigger also available via workflow_dispatch.

on:
  schedule:
    - cron: '0 4 * * 0'   # every Sunday 04:00 UTC
    - cron: '0 4 * * 3'   # every Wednesday 04:00 UTC - picks up mid-week
                           # inventory growth (Yad2 subdivision now adds
                           # thousands of listings per converge cycle).
  workflow_dispatch:

env:
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  SENTRY_ENV: production

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # required so the bot can git push

    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so the commit is fast-forwardable
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Sitemap + RSS + report generators use only the stdlib - no pip install
      # needed beyond what already runs in the scraper workflow.  Keep the
      # script set minimal so cold-start is fast.

      - name: Generate dynamic sitemap
        id: sitemap
        env:
          VITE_SUPABASE_URL:           ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:   ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/generate_sitemap.py > sitemap_summary.json
          cat sitemap_summary.json

      - name: Generate weekly market report
        env:
          VITE_SUPABASE_URL:           ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:   ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/generate_weekly_report.py

      - name: Generate RSS feed
        env:
          VITE_SUPABASE_URL:           ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:   ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/generate_rss.py

      # Re-run the sitemap once more so it picks up the freshly-written blog
      # post.  Tiny re-run, ~2 seconds.
      - name: Regenerate sitemap after blog post
        env:
          VITE_SUPABASE_URL:           ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:   ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/generate_sitemap.py > sitemap_summary.json

      - name: Submit URLs to IndexNow (Bing/Yandex/Seznam)
        continue-on-error: true
        run: cat sitemap_summary.json | python scripts/submit_indexnow.py

      - name: Ping Google sitemap endpoint (best-effort)
        continue-on-error: true
        run: |
          # Google deprecated the explicit ping endpoint in mid-2023, but the
          # sitemap-discovery URL still triggers a re-crawl heuristically.
          curl -s -o /dev/null -w 'google sitemap ping: %{http_code}\n' \
            "https://www.google.com/ping?sitemap=https://www.bebkey.com/sitemap.xml" || true
          curl -s -o /dev/null -w 'bing  sitemap ping: %{http_code}\n' \
            "https://www.bing.com/ping?sitemap=https://www.bebkey.com/sitemap.xml" || true

      - name: Commit regenerated sitemap, blog, RSS
        run: |
          git config user.name  "bebkey-seo-bot"
          # Vercel authorizes a git-triggered deploy only when the commit
          # author email matches a Vercel team member.  bot@bebkey.com is not
          # one, so deploys of the weekly sitemap/blog were being rejected
          # ("not a member of the team") and never went live.  Use the owner's
          # Vercel-linked email so the auto-deploy is accepted.
          git config user.email "admin@bebkey.com"
          git add public/sitemap*.xml public/feed.xml public/blog/
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          DATE=$(date -u +'%Y-%m-%d')
          git commit -m "chore(seo): weekly sitemap + blog post + RSS - $DATE

          Auto-generated by .github/workflows/seo_weekly.yml.
          " || true
          git push origin HEAD:master || true

      - name: Telegram summary (if bot token set)
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID:    ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ADMIN_CHAT_ID" ]; then
            echo "no Telegram secrets - skipping"
            exit 0
          fi
          TOTAL=$(jq -r '.total // 0' sitemap_summary.json 2>/dev/null || echo 0)
          LANDINGS=$(jq -r '.counts.landings // 0' sitemap_summary.json 2>/dev/null || echo 0)
          LISTINGS=$(jq -r '.counts.listings // 0' sitemap_summary.json 2>/dev/null || echo 0)
          MSG=$(printf '✅ *BebKey SEO weekly*\nSitemap: %s URLs\nLandings: %s\nListings: %s\nNew blog post + RSS pushed to master' \
            "$TOTAL" "$LANDINGS" "$LISTINGS")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_ADMIN_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$MSG" > /dev/null
