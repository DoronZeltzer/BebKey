name: Real Estate Scrapers (cheap/fast)

# Lightweight httpx-only refresh on the days the full pipeline doesn't run.
# The HEAVY pipeline (scraper.yml) runs Sun/Tue/Thu; this runs Mon/Wed/Fri/Sat,
# so the catalog + city dropdown stay fresh ~7 days/week.
#
# Only the cheap httpx sources + dedup + city canonicalization — NO Playwright,
# Telegram, geocode, translate, or AI summaries — so each run is ~25-30 min and
# total Actions usage (heavy ~76min×3/wk + this ~28min×4/wk ≈ 1,700/mo) stays
# under the 2,000 min/mo free tier. New listings get geocoded/translated/AI-
# summarised + alerted on the next heavy day (≤2 days later).

on:
  schedule:
    - cron: '0 3 * * 1,3,5,6'   # 06:00 IL on Mon, Wed, Fri, Sat
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape-cheap:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install -r scrapers/requirements.txt

      - name: Run Jerusalem Post scraper (httpx + BeautifulSoup)
        continue-on-error: true
        timeout-minutes: 8
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JPOST_MAX_PAGES: "25"
          JPOST_CONCURRENCY: "3"
        run: python scrapers/jpost_scraper.py

      - name: Run OnMap scraper (sitemap + httpx + BeautifulSoup)
        continue-on-error: true
        timeout-minutes: 15
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ONMAP_CONCURRENCY: "3"
          ONMAP_MAX_LISTINGS: "10000"
          # Runs DIRECT (no proxy). OnMap was never IP-blocked — "parse_none" was a
          # Brotli decode bug, fixed in scraper_utils (Accept-Encoding now
          # gzip/deflate). Keeps the residential-proxy bandwidth for FB.
        run: python scrapers/onmap_scraper.py

      - name: Run Komo scraper (httpx + BeautifulSoup)
        continue-on-error: true
        timeout-minutes: 8
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KOMO_MAX_PAGES: "60"
          KOMO_CONCURRENCY: "3"
        run: python scrapers/komo_scraper.py

      - name: Run Yad2 direct API scraper (httpx, no browser)
        continue-on-error: true
        # 15 min (was 10): city list grew to ~1,200 Yad2-mapped localities.
        timeout-minutes: 15
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YAD2_API_CONCURRENCY: "6"
        run: python scrapers/yad2_api_scraper.py

      - name: Dedup listings (same source+city+price+rooms)
        continue-on-error: true
        timeout-minutes: 5
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scrapers/dedup_listings.py

      - name: Canonicalize city names (merge spelling variants, drop foreign)
        continue-on-error: true
        timeout-minutes: 5
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scrapers/backfill_city_canonical.py --apply

      - name: Expire lapsed listing boosts
        continue-on-error: true
        timeout-minutes: 3
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scrapers/expire_boosts.py
